services:
  configuration-generator:
    restart: unless-stopped
    build: image
    volumes:
      - ./data:/data
    command: "--format json --on-completed 'echo The command to run after generation of an output file' --watch /data/ --data-file /data/data.json --data-file /data/files.json /data/template.j2 /data/configuration.conf"
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 1s
      retries: 2
      start_period: 2s
